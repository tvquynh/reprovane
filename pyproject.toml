[build-system]
requires = ["setuptools>=77,<81", "wheel>=0.43,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "scholarflow"
dynamic = ["version"]
description = "ScholarFlow — Reproducible literature discovery, screening, and evidence management."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["requests>=2.31,<3", "pypdf>=6,<7"]

[project.scripts]
scholarflow = "scholarflow.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["scholarflow*"]

[tool.setuptools.dynamic]
version = {attr = "scholarflow._version.__version__"}

[tool.setuptools.package-data]
"scholarflow.core" = ["migrations/*.sql"]

[tool.setuptools.data-files]
"share/doc/scholarflow" = ["MIGRATION_TO_SCHOLARFLOW.md", "OPERATIONS.md", "SECURITY.md", "ARCHITECTURE.md", "CHANGELOG.md", "LICENSE", "PROVENANCE.md"]

"share/doc/scholarflow/architecture" = ["docs/architecture/*.md"]
