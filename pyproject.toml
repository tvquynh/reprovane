[build-system]
requires = ["setuptools>=77,<81", "wheel>=0.43,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "reprovane"
dynamic = ["version"]
description = "Reprovane — Reproducible literature discovery, screening, and evidence management."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["requests>=2.31,<3", "pypdf>=6,<7"]

[project.urls]
Homepage = "https://github.com/tvquynh/reprovane"
Repository = "https://github.com/tvquynh/reprovane"
Issues = "https://github.com/tvquynh/reprovane/issues"
Documentation = "https://github.com/tvquynh/reprovane#documentation"

[project.scripts]
reprovane = "reprovane.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["reprovane*"]

[tool.setuptools.dynamic]
version = {attr = "reprovane._version.__version__"}

[tool.setuptools.package-data]
"reprovane.core" = ["migrations/*.sql"]

[tool.setuptools.data-files]
"share/doc/reprovane" = ["README.md", "QUICKSTART.md", "USER_GUIDE.md", "QUICKSTART_vi.md", "USER_GUIDE_vi.md", "MIGRATION_FROM_SCHOLARFLOW_1.md", "THIRD_PARTY_DATA.md", "MIGRATION_TO_SCHOLARFLOW.md", "OPERATIONS.md", "SECURITY.md", "ARCHITECTURE.md", "CHANGELOG.md", "LICENSE", "PROVENANCE.md"]

"share/doc/reprovane/architecture" = ["docs/architecture/*.md"]
